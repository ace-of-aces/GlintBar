# Attaches GlintBar.dmg to the release for every pushed version tag (v1.2.3). Publishing a
# release on GitHub pushes its tag, so the DMG is added to that release a few minutes later;
# pushing just a tag creates the release with generated notes.
# The version in Info.plist is taken from the tag, so it doesn't need bumping by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Set version
        run: |
          plist=Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" "$plist"
      - name: Build
        run: ./scripts/build-app.sh
      - name: Package
        run: |
          ./scripts/make-dmg.sh
          cd build && shasum -a 256 GlintBar.dmg > GlintBar.dmg.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(build/GlintBar.dmg build/GlintBar.dmg.sha256)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "GlintBar ${GITHUB_REF_NAME#v}" --generate-notes
          fi

# Builds GlintBar and runs its tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: ./scripts/format.sh --check
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
